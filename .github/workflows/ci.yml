name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  API_KEY: ci-test-key
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-msmarco-v1

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv run python -m spacy download en_core_web_sm

      - name: Run unit tests (integration excluded)
        run: uv run pytest -m "not integration" -q --durations=10

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: production-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container boots and /health is 200
        run: |
          docker run -d --name rag -p 8000:8000 -e API_KEY=ci-test-key production-rag:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" localhost:8000/health || true)
            [ "$code" = "200" ] && echo "healthy" && exit 0
            sleep 5
          done
          docker logs rag; exit 1
