name: Eval quality gate

# RAGAS-style faithfulness + context-precision gate, judged by a local Ollama
# model. Heavy (pulls llama3.2, ~2 GB), so it does not run on every push:
#   - on PRs that touch retrieval / generation / prompts
#   - weekly, to catch model/dependency drift
#   - on demand
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "src/retrieval/**"
      - "src/generation/**"
      - "prompts/**"
      - "tests/evals/**"

env:
  API_KEY: ci-test-key
  OLLAMA_BASE_URL: http://localhost:11434
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-msmarco-v1

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv run python -m spacy download en_core_web_sm

      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Run eval gate
        run: uv run python -m tests.evals.run_evals
